# Allure TestOps — проекты и шаблоны launch
# Ключи project/launch: одна «логическая» часть после префикса (через дефис, не точку)
# чтобы readProperties в Jenkins не вкладывал ключи в nested map.

allure.endpoint=https://testops.domain.net

# Web pipeline (Jenkinsfile)
allure.project.web=8
allure.launch.web=Web Chrome Selenoid - ${BRANCH_NAME}

# Desktop: web-тесты на Electron (shared UI)
allure.project.desktop-web=9
allure.launch.desktop-web=Desktop Web-tests ${PLATFORM} ${APP_VERSION} - ${BRANCH_NAME}

# Desktop: Playwright-only (desktop-tests модуль)
allure.project.desktop-playwright=9
allure.launch.desktop-playwright=Desktop Playwright ${PLATFORM} ${APP_VERSION} - ${BRANCH_NAME}

# Mobile (Jenkinsfile.mobile)
allure.project.mobile-android=8
allure.project.mobile-ios=8
allure.launch.mobile-android=Mobile Android - ${BRANCH_NAME}
allure.launch.mobile-ios=Mobile iOS - ${BRANCH_NAME}

# Full regression orchestrator
allure.launch.full-regression=Full Regression ${BRANCH_NAME}
