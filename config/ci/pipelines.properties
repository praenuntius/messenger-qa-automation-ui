# Маппинг Jenkins job → профиль запуска
# profile.id = имя файла в config/run-profiles/{id}.properties
#
# Инфраструктура (согласованная схема):
#   Linux ВМ  — Jenkins controller, Selenoid, web (qa-automation-ui), desktop Linux (label linux-desktop)
#   Mac ВМ    — mobile (mac-mobile), desktop Mac опционально (тот же label)
#   Windows ВМ — вне scope, запросить позже (label windows-desktop)
#
# Jenkins job name (как в UI)              | profile.id                  | jenkinsfile
# ----------------------------------------|-----------------------------|---------------------------
# qa-automation-ui                        | web-selenoid-ci             | Jenkinsfile
# desktop (Linux Ubuntu 22.04.5 LTS)      | desktop-web-linux-ci        | Jenkinsfile.desktop
# desktop (Mac)                           | desktop-web-mac-ci          | Jenkinsfile.desktop
# mobile-tests-android                    | mobile-android-ci           | Jenkinsfile.mobile
# mobile-tests-ios                        | mobile-ios-ci               | Jenkinsfile.mobile
# full-regression                         | —                           | Jenkinsfile.full-regression

# --- Web (Linux ВМ) ---
pipeline.web.jenkins.job=qa-automation-ui
pipeline.web.profile=web-selenoid-ci
pipeline.web.jenkinsfile=Jenkinsfile
pipeline.web.agent=any
pipeline.web.allure.project.key=web

# --- Desktop Linux (shared web-tests на Electron, Linux ВМ) ---
pipeline.desktop.linux.jenkins.job=desktop (Linux Ubuntu 22.04.5 LTS)
pipeline.desktop.linux.profile=desktop-web-linux-ci
pipeline.desktop.linux.jenkinsfile=Jenkinsfile.desktop
pipeline.desktop.linux.agent=linux-desktop
pipeline.desktop.linux.allure.project.key=desktop-web
pipeline.desktop.linux.module=web-tests

# --- Desktop Mac (опционально, Mac ВМ, тот же Jenkinsfile.desktop) ---
pipeline.desktop.mac.jenkins.job=desktop (Mac)
pipeline.desktop.mac.profile=desktop-web-mac-ci
pipeline.desktop.mac.jenkinsfile=Jenkinsfile.desktop
pipeline.desktop.mac.agent=mac-mobile
pipeline.desktop.mac.allure.project.key=desktop-web
pipeline.desktop.mac.module=web-tests

# --- Desktop Playwright-only ---
pipeline.desktop.playwright.profile=desktop-playwright-linux-ci
pipeline.desktop.playwright.module=desktop-tests

# --- Mobile (Mac ВМ) ---
pipeline.mobile.android.jenkins.job=mobile-tests-android
pipeline.mobile.ios.jenkins.job=mobile-tests-ios
pipeline.mobile.jenkinsfile=Jenkinsfile.mobile
pipeline.mobile.agent=mac-mobile
pipeline.mobile.android.profile=mobile-android-ci
pipeline.mobile.ios.profile=mobile-ios-ci
pipeline.mobile.android.allure.project.key=mobile-android
pipeline.mobile.ios.allure.project.key=mobile-ios

# --- Full regression orchestrator ---
# Фаза 1: web (Linux) || mobile android + ios (Mac)
# Фаза 2: desktop Linux (Linux, после web)
# Фаза 3: desktop Mac (Mac, опционально, после фазы 1)
pipeline.full.regression.jenkins.job=full-regression
pipeline.full.regression.jenkinsfile=Jenkinsfile.full-regression
